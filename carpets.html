<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carpets — 31 Designs | Sunita Traders Jaipur</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--maroon:#4A0E0E;--gold:#C9A227;--gold-lt:#E9CE7A;--cream:#FAF6EE;--line:#EADFC3;--muted:#6f6259;--green:#1FA855}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,Arial,sans-serif;background:var(--cream);color:#241612}h1,h2{font-family:'Playfair Display',serif}.wrap{max-width:1220px;margin:auto;padding:0 22px}header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}.nav{max-width:1220px;margin:auto;padding:12px 22px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.mono{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#fff}.hero{background:linear-gradient(100deg,rgba(26,4,4,.93),rgba(74,14,14,.7)),url('images/carpets/carpet-01.jpg') center/cover;color:#fff}.hero .wrap{padding:56px 22px}.hero p{color:#EADFC3}.crumb{font-size:13px;color:var(--gold-lt)}.crumb a{color:#fff;text-decoration:underline}.back{display:inline-block;margin-top:12px;background:#fff;color:var(--maroon);font-weight:700;padding:9px 18px;border-radius:999px;font-size:14px}.tools{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;margin:22px 0;align-items:center;flex-wrap:wrap}.tools input{flex:1;min-width:200px;padding:11px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--cream)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding-bottom:40px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.card img{width:100%;height:230px;object-fit:cover;cursor:zoom-in}.card .b{padding:12px 14px 14px}.card b{color:var(--maroon)}.card small{color:var(--muted);display:block}.row{display:flex;gap:8px;margin-top:10px}.row a{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:13px;font-weight:700}.wa{background:var(--green);color:#fff}.call{border:1.5px solid var(--maroon);color:var(--maroon)}.tag{position:absolute;top:10px;left:10px;background:rgba(74,14,14,.92);color:var(--gold-lt);font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px}.im{position:relative}#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:99;padding:20px}#lb img{max-width:min(900px,92vw);max-height:75vh;border:3px solid var(--gold);border-radius:10px}#lb button{background:var(--gold);border:none;padding:9px 18px;border-radius:999px;font-weight:800;color:var(--maroon);cursor:pointer}</style>
</head>
<body>
<header><div class="nav"><div class="brand"><img class="mono" src="images/logo-small.png" alt="Sunita Traders logo"><b>SUNITA TRADERS</b></div><a href="index.html" style="font-weight:700;color:var(--maroon)">← Home</a></div></header>
<div class="hero"><div class="wrap"><div class="crumb"><a href="index.html">Home</a> / Carpets</div><h1 style="font-size:clamp(30px,4vw,48px)">Carpets — 31 Designs</h1><p>Wedding • Home • Event • Runners. Trusted since 1970. Tap a photo to zoom, then enquire on WhatsApp. All-India delivery available.</p><a class="back" href="doormats.html">Also see Door Mats →</a></div></div>
<div class="wrap"><div class="tools"><input id="q" placeholder="Search — e.g. ST-C05"><span id="c" style="font-size:13px;color:var(--muted)"></span><a href="https://wa.me/917976943373?text=Namaste!%20Mujhe%20carpet%20catalog%20chahiye" target="_blank" rel="noopener" style="background:var(--maroon);color:var(--gold-lt);padding:10px 20px;border-radius:999px;font-weight:700;font-size:14px">WhatsApp Full List</a></div>
<div class="grid" id="g"></div></div>
<div id="lb" onclick="if(event.target.id==='lb')this.style.display='none'"><img id="li"><div id="lc" style="color:#fff;font-weight:600"></div><div style="display:flex;gap:8px"><button onclick="mv(-1)">← Prev</button><button onclick="document.getElementById('lb').style.display='none'">Close</button><button onclick="mv(1)">Next →</button></div></div>
<script>
const items=Array.from({length:31},(_,i)=>({sku:'ST-C'+String(i+1).padStart(2,'0'),name:'Carpet Design '+(i+1),src:`images/carpets/carpet-${String(i+1).padStart(2,'0')}.jpg`}));
let cur=0,vis=items;const g=document.getElementById('g'),q=document.getElementById('q'),c=document.getElementById('c');
function render(){const t=q.value.toLowerCase();vis=items.filter(x=>(x.sku+x.name).toLowerCase().includes(t));c.textContent=vis.length+' designs';g.innerHTML=vis.map(x=>{const i=items.indexOf(x);const m=encodeURIComponent(`Namaste! Mujhe ${x.sku} (${x.name}) chahiye. Price kya hai?`);return `<div class="card"><div class="im"><span class="tag">${x.sku}</span><img loading="lazy" src="${x.src}" onclick="open(${i})"></div><div class="b"><b>${x.name}</b><small>Carpet • Wedding / Home</small><div class="row"><a class="wa" target="_blank" href="https://wa.me/917976943373?text=${m}">WhatsApp</a><a class="call" href="tel:+917976943373">Call</a></div></div></div>`}).join('');}
q.oninput=render;function open(i){cur=i;show();}function show(){const x=items[cur];document.getElementById('li').src=x.src;document.getElementById('lc').textContent=x.sku+' • '+x.name;document.getElementById('lb').style.display='flex';}function mv(d){cur=(cur+d+items.length)%items.length;show();}
document.addEventListener('keydown',e=>{if(document.getElementById('lb').style.display!=='flex')return;if(e.key==='ArrowRight')mv(1);if(e.key==='ArrowLeft')mv(-1);if(e.key==='Escape')document.getElementById('lb').style.display='none';});
render();
</script>
</body>
</html>
